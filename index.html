<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiHAUZ — Simulador Hipotecario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- React y ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Chart.js y react-chartjs-2 (Más estable para uso directo sin Node.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-chartjs-2@5.2.0/dist/index.umd.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- CSS Premium -->
  <link rel="stylesheet" href="css/app.css?v=6">
  <link rel="stylesheet" href="css/pdf-report.css?v=6">

  <!-- Lógica Financiera Centralizada -->
  <script src="js/financial_logic.js?v=6"></script>
</head>

<body>

  <div id="root"></div>
  <div id="error-log"
    style="color: red; padding: 20px; font-family: monospace; white-space: pre-wrap; font-size: 16px;"></div>

  <script>
    window.addEventListener('error', function (event) {
      document.getElementById('error-log').innerText += 'Error: ' + event.message + '\n';
    });
    window.addEventListener('unhandledrejection', function (event) {
      document.getElementById('error-log').innerText += 'Promise Error: ' + event.reason + '\n';
    });
  </script>

  <!-- Scripts Modulares -->
  <script src="js/globals.js?v=6" type="text/babel"></script>
  <script src="js/components.js?v=6" type="text/babel"></script>
  <script src="js/charts.js?v=6" type="text/babel"></script>
  <script src="js/escenarios.js?v=6" type="text/babel"></script>
  <script src="js/tabla.js?v=6" type="text/babel"></script>
  <script src="js/pdf-report.js?v=6" type="text/babel"></script>
  <script src="js/app.js?v=6" type="text/babel"></script>

</body>

</html>
